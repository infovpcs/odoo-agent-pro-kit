name: ${COMPOSE_PROJECT_NAME}
services:
  db:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ODOO_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data
      - ${SESSION_LOGS_DIR}:/session-logs
  odoo:
    image: ${ODOO_DEV_IMAGE}
    build:
      context: ${REPOSITORY_ROOT}
      dockerfile: sandbox/images/odoo-dev/Dockerfile
      args:
        ODOO_BASE_IMAGE: ${ODOO_BASE_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["odoo", "--config", "/etc/odoo/odoo.conf"]
    volumes:
      - ${ODOO_CONFIG_FILE}:/etc/odoo/odoo.conf:ro
      - ${ADDONS_DIR}:/mnt/extra-addons:ro
      - filestore:/var/lib/odoo
      - cache:/var/lib/odoo/.cache
      - ${SESSION_LOGS_DIR}:/var/log/odoo
      - ${SESSION_RESULTS_DIR}:/var/lib/odoo/results
volumes:
  db-data:
  filestore:
  cache:
